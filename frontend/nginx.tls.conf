# Production: HTTPS only. Certificates come from deploy/prod/secrets/tls. Same routes as nginx.conf.
server {
  listen 80;
  server_tokens off;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_tokens off;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;

  location = /api/events {
    proxy_pass http://api-gateway:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header traceparent "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api-gateway:8000;
    proxy_set_header Host $host;
    # Overwrite (never append) so a client cannot spoof its address for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # A client does not choose which trace its request joins.
    proxy_set_header traceparent "";
  }

  location /assets/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
