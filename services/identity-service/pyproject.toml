[project]
name = "identity-service"
version = "0.1.0"
description = "OpsPilot identity: users, roles, password + TOTP sign-in, session tokens"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opspilot-common[fastapi]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
]

[tool.uv.sources]
opspilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
