[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "OpsPilot agents: LangGraph workflow (privacy gate, intake, dedupe, approval gates) on the local model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opspilot-common[fastapi]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.27",
  "redis>=5.2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-ollama>=1.1,<2",
  "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
opspilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]
