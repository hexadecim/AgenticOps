[project]
name = "ops-service"
version = "0.1.0"
description = "OpsPilot ops: health probes, masked log search, runbook retrieval (pgvector), allow-listed actions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opspilot-common[fastapi]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pgvector>=0.3.6",
]

[tool.uv.sources]
opspilot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_service"]
