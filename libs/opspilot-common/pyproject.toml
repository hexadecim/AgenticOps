[project]
name = "opspilot-common"
version = "0.1.0"
description = "Shared building blocks for OpsPilot services: resilience, events, auth, logging"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "redis>=5.2",
  "structlog>=24.4",
  "pyjwt>=2.9",
  "prometheus-client>=0.21",
  "sqlalchemy[asyncio]>=2.0.36",
  "aio-pika>=9.4",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_common"]
